<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Herramienta de Análisis - Cronografías</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff !important; 
            overflow: hidden; color: #333; 
        }
        #main-wrapper { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .header-container { width: 100%; display: flex; justify-content: center; padding-top: 10px; pointer-events: auto; }
        .title-box { text-align: center; background: rgba(255,255,255,0.85); padding: 5px 15px; border-radius: 15px; backdrop-filter: blur(2px); }
        .title-box h1 { margin: 0; font-size: 1.3rem; font-weight: 800; color: #2d3436; text-transform: uppercase; }
        .title-box h2 { margin: 0; font-size: 0.8rem; font-weight: 500; color: #636e72; }

        .controls-area { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; pointer-events: auto; }
        .speed-btn { background: #f1f2f6; color: #636e72; border: 1px solid #ced6e0; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .speed-btn.active { background: #74b9ff; color: white; border-color: #74b9ff; }

        #clock { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; font-weight: 800; background: rgba(255,255,255,0.9); color: #2d3436; padding: 4px 15px; border-radius: 12px; border: 1px solid #dfe6e9; pointer-events: auto; }

        .label {
            position: absolute; font-size: 0.65rem; font-weight: bold; color: #2d3436;
            border: 1px solid rgba(0,0,0,0.1); width: 90px; height: 50px; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
            pointer-events: none; background: rgba(255,255,255,0.85); padding: 2px;
            transform: translate(-50%, -50%); z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .pct-indicator { font-size: 0.85rem; color: #0984e3; margin-top: 2px; font-weight: 800; }

        #data-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 850px;
            text-align: center; border: 1px solid #eee; height: 75vh; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%; flex-grow: 1; background: #f8f9fa; color: #2d3436; border: 1px solid #dfe6e9;
            padding: 10px; font-family: 'Consolas', monospace; margin-top: 10px; font-size: 0.75rem; border-radius: 5px;
            white-space: pre; overflow: auto;
        }
        button.start-btn {
            background: #74b9ff; color: white; border: none; padding: 12px 40px;
            font-size: 1.1rem; margin-top: 15px; cursor: pointer; border-radius: 50px;
            font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 10px rgba(116, 185, 255, 0.4);
        }
        button.start-btn:hover { background: #0984e3; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="data-modal">
    <div class="modal-content">
        <h2 style="margin: 0 0 10px 0; color:#2d3436">📊 Carga de Datos de Uso del Tiempo</h2>
        <p style="color: #636e72; margin: 0 0 10px 0; font-size: 0.9rem;">
            Pega tu CSV con las 48 columnas de 30 minutos (de 00:00 a 23:30) para iniciar la simulación.
        </p>
        <textarea id="csv-input">ID,Grupo ,Género,00:00,00:30,01:00,01:30,02:00,02:30,03:00,03:30,04:00,04:30,05:00,05:30,06:00,06:30,07:00,07:30,08:00,08:30,09:00,09:30,10:00,10:30,11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:30,18:00,18:30,19:00,19:30,20:00,20:30,21:00,21:30,22:00,22:30,23:00,23:30
1,Economía,Mujer,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Cuidado personal,Preparar alimentos,Tareas del hogar,Tareas del hogar,Tareas del hogar,Ejercicio y/o deporte,Ejercicio y/o deporte,Tareas y estudio,Tareas y estudio,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Traslado,Convivir con familia,Convivir con familia,Tareas y estudio,Tareas y estudio,Preparar alimentos,Comer y beber,Convivir con familia,Convivir con familia,Preparar alimentos,Comer y beber,Otras actividades,Otras actividades,Otras actividades,Otras actividades,Dormir,Dormir
2,Economia,Mujer,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Cuidado personal,Traslado,Traslado,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Comer y beber,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Socializar,Traslado,Traslado,Comer y beber,Convivir con familia,Entretenimiento,Tareas del hogar,Entretenimiento,Convivir con familia,Entretenimiento,Entretenimiento,Cuidado personal,Tareas y estudio,Tareas y estudio,Tareas y estudio,Entretenimiento,Tareas y estudio,Tareas y estudio,Tareas y estudio,Dormir
3,Economía,Hombre,Tareas y estudio,Tareas y estudio,Tareas y estudio,Tareas y estudio,Tareas y estudio,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Dormir,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Clases en la facultad,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Trabajar,Convivir con familia,Convivir con familia,Convivir con familia,Tareas del hogar,Tareas del hogar,Tareas y estudio</textarea>
        <button class="start-btn" onclick="iniciarSimulacion()">Iniciar Visualización</button>
    </div>
</div>

<div id="main-wrapper">
    <canvas id="canvas"></canvas>
    <div id="ui-layer">
        <div class="header-container">
            <div class="title-box">
                <h1>Cronografía de Uso del Tiempo</h1>
                <h2>Facultad de Ciencias Sociales</h2>
            </div>
        </div>
        <div class="controls-area">
            <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
            <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
            <button class="speed-btn" onclick="setSpeed(4, this)">4x</button>
        </div>
        <div id="clock">00:00</div>
    </div>
</div>

<script>
    // 1. DEFINICIÓN DE HUBS Y NODOS DE ACTIVIDAD
    const hubs = [
        { id: "Dormir", label: "Dormir", color: "#a29bfe" },
        { id: "Clases en la facultad", label: "Clases", color: "#0984e3" },
        { id: "Tareas y estudio", label: "Estudio", color: "#74b9ff" },
        { id: "Trabajar", label: "Trabajo", color: "#e17055" },
        { id: "Traslado", label: "Traslado", color: "#fdcb6e" },
        { id: "Cuidados y Hogar", label: "Cuidados/Hogar", color: "#e84393" },
        { id: "Alimentación y Personal", label: "Alimentación/Personal", color: "#00b894" },
        { id: "Tiempo Libre", label: "Tiempo Libre", color: "#55efc4" }
    ];

    // Mapeo unificado para estandarizar las opciones del formulario
    function mapearActividad(act) {
        if (!act) return "Tiempo Libre";
        act = act.trim();
        if (act === "Dormir") return "Dormir";
        if (act === "Clases en la facultad") return "Clases en la facultad";
        if (act === "Tareas y estudio") return "Tareas y estudio";
        if (act === "Trabajar" || act === "Trabajo remunerado") return "Trabajar";
        if (act === "Traslado") return "Traslado";
        if (act.includes("Tareas del hogar") || act.includes("Cuidados") || act.includes("Preparar alimentos")) return "Cuidados y Hogar";
        if (act.includes("Comer") || act.includes("Cuidado personal")) return "Alimentación y Personal";
        return "Tiempo Libre";
    }

    let width = window.innerWidth;
    let height = window.innerHeight;
    let canvas = document.getElementById("canvas");
    let ctx = canvas.getContext("2d");
    canvas.width = width;
    canvas.height = height;

    let timeSlots = [];
    let students = [];
    let nodes = [];
    let currentSlotIndex = 0;
    let speed = 1;
    let labelsElements = {};

    // Asignar posiciones circulares a los Hubs
    function calcularPosicionesHubs() {
        const cx = width / 2;
        const cy = height / 2;
        const rx = Math.min(width, height) * 0.35;
        const ry = Math.min(width, height) * 0.35;

        hubs.forEach((hub, i) => {
            const angle = (i / hubs.length) * 2 * Math.PI - Math.PI / 2;
            hub.x = cx + rx * Math.cos(angle);
            hub.y = cy + ry * Math.sin(angle);
        });
    }

    function crearEtiquetasUI() {
        const uiLayer = document.getElementById("ui-layer");
        hubs.forEach(hub => {
            let el = document.createElement("div");
            el.className = "label";
            el.innerHTML = `<div>${hub.label}</div><div class="pct-indicator" id="pct-${hub.id}">0%</div>`;
            uiLayer.appendChild(el);
            labelsElements[hub.id] = el;
        });
    }

    function actualizarEtiquetasUI() {
        hubs.forEach(hub => {
            let el = labelsElements[hub.id];
            if (el) {
                el.style.left = `${hub.x}px`;
                el.style.top = `${hub.y}px`;
            }
        });
    }

    function iniciarSimulacion() {
        const csvText = document.getElementById("csv-input").value;
        const data = d3.csvParse(csvText);
        
        // Extraer columnas de tiempo
        timeSlots = data.columns.filter(c => c.includes(":"));
        
        // Crear nodos de estudiantes
        nodes = data.map((d, i) => {
            return {
                id: d.ID || i,
                gender: d.Género,
                schedule: d,
                x: width / 2 + (Math.random() - 0.5) * 50,
                y: height / 2 + (Math.random() - 0.5) * 50,
                targetX: width / 2,
                targetY: height / 2,
                currentHub: "Dormir"
            };
        });

        document.getElementById("data-modal").style.display = "none";
        calcularPosicionesHubs();
        crearEtiquetasUI();
        actualizarEtiquetasUI();
        
        // Iniciar loop de animación
        setInterval(avanzarTiempo, 1200 / speed);
        requestAnimationFrame(render);
    }

    function avanzarTiempo() {
        if (timeSlots.length === 0) return;
        
        let currentTime = timeSlots[currentSlotIndex];
        document.getElementById("clock").innerText = currentTime;

        let conteo = {};
        hubs.forEach(h => conteo[h.id] = 0);

        nodes.forEach(node => {
            let actRaw = node.schedule[currentTime];
            let hubId = mapearActividad(actRaw);
            node.currentHub = hubId;
            conteo[hubId] = (conteo[hubId] || 0) + 1;

            let hub = hubs.find(h => h.id === hubId);
            if (hub) {
                // Dispersión suave alrededor del hub
                let angle = Math.random() * 2 * Math.PI;
                let r = Math.random() * 35;
                node.targetX = hub.x + r * Math.cos(angle);
                node.targetY = hub.y + r * Math.sin(angle);
            }
        });

        // Actualizar porcentajes
        hubs.forEach(h => {
            let pct = Math.round(((conteo[h.id] || 0) / nodes.length) * 100);
            let pctEl = document.getElementById(`pct-${h.id}`);
            if (pctEl) pctEl.innerText = `${pct}%`;
        });

        currentSlotIndex = (currentSlotIndex + 1) % timeSlots.length;
    }

    function setSpeed(val, btn) {
        speed = val;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function render() {
        ctx.clearRect(0, 0, width, height);

        // Renderizar conexiones/puntos
        nodes.forEach(node => {
            // Suavizado de movimiento (lerp)
            node.x += (node.targetX - node.x) * 0.1;
            node.y += (node.targetY - node.y) * 0.1;

            let hub = hubs.find(h => h.id === node.currentHub);
            ctx.beginPath();
            ctx.arc(node.x, node.y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = hub ? hub.color : "#b2bec3";
            ctx.fill();
        });

        requestAnimationFrame(render);
    }

    window.addEventListener("resize", () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        calcularPosicionesHubs();
        actualizarEtiquetasUI();
    });
</script>
</body>
</html>
